<div class="min-h-screen bg-gradient-to-br from-background via-background to-primary/5 flex items-center justify-center p-4">
  <div class="fixed top-4 right-4 z-50">
    <ui-theme-toggle></ui-theme-toggle>
  </div>

  <div class="w-full max-w-md">
    <a routerLink="/" class="flex items-center justify-center gap-2 mb-8 group">
      <div class="p-2 rounded-xl bg-primary/10 backdrop-blur-glass border border-primary/20 group-hover:bg-primary/20 transition-all">
        <i-lucide name="target" class="w-6 h-6 text-primary"></i-lucide>
      </div>
      <span class="text-2xl font-semibold bg-gradient-to-r from-foreground to-foreground/70 bg-clip-text text-transparent">
        PropectaAI
      </span>
    </a>

    <ui-card class="backdrop-blur-glass bg-card/80 border-border/50 shadow-glass-lg">
      <ui-card-header class="space-y-1 pb-4">
        <ui-card-title class="text-2xl font-semibold text-center">Redefinir senha</ui-card-title>
        <ui-card-description class="text-center text-muted-foreground">
          Insira sua nova senha após validação do link
        </ui-card-description>
      </ui-card-header>

      <ui-card-content>
        <div *ngIf="isValidating()" class="rounded-lg border bg-card/80 text-card-foreground shadow-sm backdrop-blur-glass border-border/50 shadow-glass-lg p-6 flex items-center gap-3">
          <span class="inline-block w-5 h-5 rounded-full border-2 border-primary border-t-transparent animate-spin"></span>
          <div>
            <h3 class="text-lg font-semibold">Validando seu acesso...</h3>
            <p class="text-sm text-muted-foreground">Aguarde enquanto confirmamos seu link.</p>
          </div>
        </div>

        <form *ngIf="!isValidating() && isValid()" [formGroup]="form" (submit)="submitReset($event)" class="space-y-4">
          <div class="space-y-2">
            <ui-label for="new-pass">Nova senha</ui-label>
            <div class="relative">
              <i-lucide name="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground"></i-lucide>
              <ui-input id="new-pass" type="password" placeholder="••••••••" className="pl-14" formControlName="newPassword"></ui-input>
            </div>
          </div>

          <div class="space-y-2">
            <ui-label for="confirm-pass">Confirmar nova senha</ui-label>
            <div class="relative">
              <i-lucide name="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground"></i-lucide>
              <ui-input id="confirm-pass" type="password" placeholder="••••••••" className="pl-14" formControlName="confirmPassword"></ui-input>
            </div>
          </div>

          <ui-button type="submit" className="mt-2 w-full text-white" [disabled]="isSubmitting()">
            {{ isSubmitting() ? 'Redefinindo...' : 'Redefinir senha' }}
          </ui-button>
        </form>

        <div *ngIf="!isValidating() && !isValid()" class="p-4 rounded-lg bg-destructive/10 border border-destructive/20 text-destructive text-sm text-center">
          O link de redefinição é inválido ou expirou.
        </div>
      </ui-card-content>
    </ui-card>
  </div>
</div>
