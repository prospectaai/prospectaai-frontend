<layout-saas-main>
  <div class="max-w-3xl mx-auto space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-xl font-semibold">Notificações</h2>
      <div class="flex items-center gap-3">
        <div class="text-sm text-muted-foreground">Não lidas: {{ notifs.getUnreadCount() }}</div>
        <ui-button variant="ghost" size="sm" (click)="notifs.markAllUnreadAsRead()" [disabled]="notifs.getUnreadCount() === 0">
          Marcar todas como lidas
        </ui-button>
      </div>
    </div>
    <div class="rounded-lg border bg-card">
      <div class="divide-y">
        <div *ngFor="let n of pagedItems" class="p-4 cursor-pointer hover:bg-muted/5 transition-colors" (click)="notifs.markRead(n.id)">
          <div class="flex items-start gap-3" [class.opacity-60]="n.read">
            <div class="mt-1">
              <i-lucide [name]="n.icon || 'Bell'" class="w-5 h-5 text-primary"></i-lucide>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-2">
                <div class="font-medium truncate">{{ n.title }}</div>
                <div class="text-xs text-muted-foreground whitespace-nowrap">{{ n.datetime }}</div>
              </div>
              <div class="text-xs text-muted-foreground mb-1">{{ n.sentLabel }}</div>
              <div *ngIf="n.content" class="text-sm mt-1 text-foreground/90 break-words">{{ n.content }}</div>

              <div class="mt-3 flex items-center gap-2">
                <button *ngIf="!n.read" type="button" class="text-xs px-2 py-1 rounded-md bg-primary/10 text-primary hover:bg-primary/20 transition-colors font-medium" (click)="notifs.markRead(n.id); $event.stopPropagation()">
                  Marcar como lida
                </button>
                <a *ngIf="n.link" [routerLink]="n.link" class="text-xs flex items-center gap-1 text-muted-foreground hover:text-primary transition-colors" (click)="$event.stopPropagation()">
                  <i-lucide name="ExternalLink" class="w-3 h-3"></i-lucide>
                  Abrir Link
                </a>
              </div>
            </div>
            <div *ngIf="!n.read" class="w-2 h-2 rounded-full bg-blue-500 mt-2 shrink-0"></div>
          </div>
        </div>

        <!-- Empty State -->
        <div *ngIf="notifs.itemsSig().length === 0" class="p-8 text-center text-muted-foreground">
          <i-lucide name="BellOff" class="w-8 h-8 mx-auto mb-2 opacity-50"></i-lucide>
          <p>Nenhuma notificação encontrada.</p>
        </div>
      </div>

      <!-- Pagination -->
      <div class="flex justify-center p-4 border-t bg-muted/10" *ngIf="notifs.itemsSig().length > 0">
        <div class="flex items-center gap-2">
          <ui-button variant="outline" size="sm" (click)="prevPage()" [disabled]="page() <= 1">
            <i-lucide name="ChevronLeft" class="w-4 h-4 mr-1"></i-lucide>
            Anterior
          </ui-button>

          <div class="flex gap-1">
            <ng-container *ngIf="showFirstPageDots">
              <ui-button
                [variant]="1 === page() ? 'default' : 'outline'"
                size="sm"
                className="w-8 h-8 p-0"
                (click)="goToPage(1)"
              >
                1
              </ui-button>
              <span class="flex items-center justify-center w-8 text-muted-foreground">...</span>
            </ng-container>
            <ng-container *ngFor="let entry of pagesWindow">
              <ui-button
                *ngIf="entry !== '...'; else dotsTpl"
                [variant]="entry === page() ? 'default' : 'outline'"
                size="sm"
                className="w-8 h-8 p-0"
                (click)="goToEntry(entry)"
              >
                {{ entry }}
              </ui-button>
            </ng-container>
            <ng-template #dotsTpl>
              <span class="flex items-center justify-center w-8 text-muted-foreground">...</span>
            </ng-template>
          </div>

          <ui-button variant="outline" size="sm" (click)="handleNextPage()" [disabled]="page() >= pageCount && !notifs.hasMore()">
            Próximo
            <i-lucide name="ChevronRight" class="w-4 h-4 ml-1"></i-lucide>
          </ui-button>
        </div>
      </div>
    </div>
  </div>
</layout-saas-main>
