<layout-saas-main>
  <div class="max-w-4xl mx-auto space-y-6 animate-fade-in">
    <!-- Header -->
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold text-foreground mb-2">Resultados</h1>
        <p class="text-muted-foreground">
          {{ mockCompanies.length }} empresas encontradas
        </p>
      </div>
      <ui-button class="gap-2 shadow-glow text-white">
        <i-lucide name="download" class="h-4 w-4"></i-lucide>
        Exportar CSV
      </ui-button>
    </div>

    <!-- Search & Filters -->
    <ui-card class="glass-effect border-0 shadow-glass">
      <div class="p-4 flex gap-3" [formGroup]="searchForm">
        <div class="relative flex-1">
          <i-lucide name="search" class="absolute left-2 top-1/2 -translate-y-1/2 h-4 w-4 text-muted-foreground"></i-lucide>
          <ui-input
            className="pl-10 bg-background/50"
            placeholder="Buscar empresas..."
            formControlName="searchTerm"
          ></ui-input>
        </div>
        <ui-button variant="outline" class="gap-2">
          <i-lucide name="filter" class="h-4 w-4"></i-lucide>
          Filtros
        </ui-button>
      </div>
    </ui-card>

    <!-- Companies Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <ui-card
        *ngFor="let company of filteredCompanies"
        class="glass-effect border-0 shadow-glass hover-lift"
      >
        <div class="p-4">
          <div class="flex items-start justify-between">
            <div class="flex-1">
              <h2 class="text-xl font-semibold mb-2">{{ company.name }}</h2>
              <div class="flex items-center gap-2 mb-2">
                <ui-badge variant="secondary" size="sm">{{ company.category }}</ui-badge>

                <ui-badge
                  *ngIf="company.status === 'verified'"
                  className="bg-primary/10 text-primary border-primary/20"
                  size="sm"
                >
                  Verificado
                </ui-badge>

                <ui-badge
                  *ngIf="company.status === 'new'"
                  className="bg-primary/10 text-primary border-primary/20"
                  size="sm"
                >
                  Novo
                </ui-badge>
              </div>
            </div>
            <div class="text-right">
              <div class="flex items-center gap-1 text-yellow-500">
                <span class="text-lg font-semibold">{{ company.rating }}</span>
                <span class="text-sm">★</span>
              </div>
            </div>
          </div>

          <div class="space-y-3 mt-3 text-sm">
            <div class="flex items-start gap-2">
              <i-lucide name="map-pin" class="h-4 w-4 text-primary mt-0.5"></i-lucide>
              <span class="text-muted-foreground">{{ company.address }}</span>
            </div>

            <div class="flex items-center gap-2">
              <i-lucide name="phone" class="h-4 w-4 text-primary"></i-lucide>
              <span class="text-muted-foreground">{{ company.phone }}</span>
            </div>

            <div class="flex items-center gap-2">
              <i-lucide name="mail" class="h-4 w-4 text-primary"></i-lucide>
              <span class="text-muted-foreground">{{ company.email }}</span>
            </div>

            <div class="grid grid-flow-col gap-1">
              <ui-button variant="outline" size="sm" className="w-full">
                <i-lucide name="external-link" class="h-4 w-4"></i-lucide>
                Ver Detalhes
              </ui-button>
              <ui-button size="sm" className="w-full text-white">
                Adicionar ao CRM
              </ui-button>
            </div>
          </div>
        </div>
      </ui-card>
    </div>

    <!-- Pagination -->
    <div class="flex justify-center pt-6">
      <ui-card class="glass-effect border-0 shadow-glass">
        <div class="p-4 flex items-center gap-2">
          <ui-button variant="outline" size="sm" [disabled]="true">Anterior</ui-button>
          <div class="flex gap-1">
            <ui-button className="text-white" variant="default" size="sm">1</ui-button>
            <ui-button variant="outline" size="sm">2</ui-button>
            <ui-button variant="outline" size="sm">3</ui-button>
          </div>
          <ui-button variant="outline" size="sm">Próximo</ui-button>
        </div>
      </ui-card>
    </div>
  </div>
</layout-saas-main>
