<div class="min-h-screen flex items-center justify-center bg-background px-6">
  <div class="fixed top-4 right-4 z-50">
    <ui-theme-toggle></ui-theme-toggle>
  </div>
  <div class="max-w-md w-full rounded-2xl border bg-card p-8 text-center space-y-4">
    <div class="mx-auto w-12 h-12 rounded-full bg-red-50 border border-red-200 flex items-center justify-center">
      <i-lucide name="AlertTriangle" class="w-6 h-6 text-red-600"></i-lucide>
    </div>
    <h1 class="text-xl font-semibold">Algo deu errado</h1>
    <p class="text-sm text-muted-foreground">{{ message() }}</p>

      <a routerLink="/auth" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium px-4 py-2 bg-primary text-white hover:bg-primary/90">
        Voltar ao login
      </a>
      <a routerLink="/" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium px-4 py-2 border">

      </a>
    </div>
  </div>
</div>
