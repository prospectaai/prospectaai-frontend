<div class="min-h-screen flex flex-col bg-background text-foreground">
  <header class="p-4 border-b border-border/50 flex items-center justify-between">
    <!-- Logo e Título -->
    <div class="flex items-center gap-2">
      <button (click)="toggleMobileMenu()" class="md:hidden p-2 rounded-md hover:bg-muted/50">
        <i-lucide name="menu" class="w-5 h-5"></i-lucide>
      </button>
      <h1 class="text-lg font-semibold">PropectaAI</h1>
    </div>

    <!-- Navegação Desktop -->
    <nav class="hidden md:flex items-center gap-6">
      <a routerLink="/saas/dashboard" routerLinkActive="text-primary font-medium" class="text-sm text-muted-foreground hover:text-primary transition-colors">Dashboard</a>
      <a routerLink="/saas/prospect" routerLinkActive="text-primary font-medium" class="text-sm text-muted-foreground hover:text-primary transition-colors">Prospecção</a>
      <a routerLink="/saas/results" routerLinkActive="text-primary font-medium" class="text-sm text-muted-foreground hover:text-primary transition-colors">Resultados</a>
    </nav>

    <!-- Avatar e Configurações -->
    <div class="flex items-center gap-2">
      <button class="p-1 rounded-md hover:bg-muted/50">
        <i-lucide name="settings" class="w-5 h-5 text-muted-foreground"></i-lucide>
      </button>
      <div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center text-primary">
        <i-lucide name="user" class="w-4 h-4"></i-lucide>
      </div>
    </div>
  </header>

  <!-- Menu Mobile -->
  <div *ngIf="mobileMenuOpen()" class="md:hidden border-b border-border/50">
    <nav class="flex flex-col p-4 space-y-3">
      <a routerLink="/saas/dashboard" routerLinkActive="text-primary font-medium" class="text-sm text-muted-foreground hover:text-primary transition-colors">Dashboard</a>
      <a routerLink="/saas/prospect" routerLinkActive="text-primary font-medium" class="text-sm text-muted-foreground hover:text-primary transition-colors">Prospecção</a>
    </nav>
  </div>

  <main class="flex-1 p-6">
    <ng-content></ng-content>
  </main>
</div>
