<ui-modal [isOpen]="isOpen" [title]="'Confirmar Código'" (close)="onClose()">
  <div class="space-y-4">
    <!-- Mensagem informativa -->
    <div class="text-center">
      <div class="mx-auto w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center mb-3">
        <i-lucide name="mail" class="w-6 h-6 text-primary"></i-lucide>
      </div>
      <p class="text-sm text-muted-foreground">
        Enviamos um código de 6 dígitos para
        <span class="font-medium text-foreground">{{ email }}</span>
      </p>
      <p class="text-xs text-muted-foreground mt-2">
        O código expira em 30 minutos
      </p>
    </div>

    <!-- Formulário de código -->
    <form [formGroup]="confirmationForm" (submit)="onConfirm()" class="space-y-4">
      <div class="space-y-2">
        <label class="text-sm font-medium text-foreground">Código de confirmação</label>
        <div class="relative">
          <i-lucide name="key" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground"></i-lucide>
          <input
            type="text"
            formControlName="code"
            placeholder="000000"
            class="w-full pl-10 pr-4 py-2 bg-background border border-border/50 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-center text-lg font-mono tracking-widest"
            maxlength="6"
            pattern="[0-9]*"
            inputmode="numeric"
          />
        </div>
        <div class="text-xs text-muted-foreground text-center">
          Digite os 6 dígitos do código
        </div>
      </div>

      <!-- Botões de ação -->
      <div class="flex gap-3">
        <button
          type="button"
          variant="outline"
          class="flex-1 px-4 py-2 text-sm font-medium text-muted-foreground bg-background border border-border/50 rounded-lg hover:bg-muted/50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
          (click)="onResend()"
          [disabled]="resendTimer() > 0"
        >
          <span *ngIf="resendTimer() === 0">Reenviar código</span>
          <span *ngIf="resendTimer() > 0">Reenviar em {{ getFormattedTimer() }}</span>
        </button>
        
        <button
          type="submit"
          class="flex-1 px-4 py-2 text-sm font-medium text-white bg-primary rounded-lg hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
          [disabled]="confirmationForm.invalid || isLoading()"
        >
          <span *ngIf="!isLoading()">Confirmar</span>
          <span *ngIf="isLoading()" class="flex items-center justify-center gap-2">
            <i-lucide name="loader-2" class="w-4 h-4 animate-spin"></i-lucide>
            Confirmando...
          </span>
        </button>
      </div>
    </form>

    <!-- Link para alterar email -->
    <div class="text-center">
      <button
        type="button"
        class="text-xs text-primary hover:text-primary/80 transition-colors"
        (click)="onClose()"
      >
        Usar outro email
      </button>
    </div>
  </div>
</ui-modal>
