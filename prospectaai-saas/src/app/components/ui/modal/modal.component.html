<div
  *ngIf="isOpen"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-in fade-in-0"
  (click)="onBackdropClick($event)"
>
  <div
    class="relative w-full bg-card border border-border/50 rounded-xl shadow-glass-lg animate-in fade-in-0 zoom-in-95"
    [class]="modalSize"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-border/50">
      <h3 class="text-lg font-semibold text-foreground">{{ title }}</h3>
      <button
        *ngIf="showCloseButton"
        type="button"
        class="p-2 rounded-md hover:bg-muted/50 transition-colors"
        (click)="onClose()"
      >
        <i-lucide name="x" class="w-4 h-4 text-muted-foreground"></i-lucide>
      </button>
    </div>

    <!-- Content -->
    <div class="p-6">
      <ng-content></ng-content>
    </div>
  </div>
</div>
